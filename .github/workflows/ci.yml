# .github/workflows/ci.yml — tiap push/PR: pasang dependensi, jalankan tes, lalu build produksi.
name: CI

on:
  push:
    branches: [main, build/mvp]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
